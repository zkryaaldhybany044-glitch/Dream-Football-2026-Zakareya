name: Build Dream Football Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build installable offline Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Bundle offline game assets
        run: |
          mkdir -p android/app/src/main/assets/vendor
          cp index.html android/app/src/main/assets/index.html
          npm install --no-save --no-package-lock three@0.170.0
          cp node_modules/three/build/three.module.js android/app/src/main/assets/vendor/three.module.js

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
        working-directory: android

      - name: Prepare downloadable APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/DF26-Android.apk
          sha256sum release/DF26-Android.apk > release/DF26-Android.apk.sha256

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dream-Football-2026-Android-APK
          path: release/*
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: df26-android-v1.0.1
          name: Dream Football 2026 - Android v1.0.1
          body: |
            Offline Android debug APK for Dream Football 2026 Zakareya.
            The game HTML and Three.js module are bundled inside the APK.
            Gameplay does not require internet access after installation.
            This is a debug-signed testing APK, not a Play Store production-signed release.
          files: |
            release/DF26-Android.apk
            release/DF26-Android.apk.sha256
          make_latest: true
